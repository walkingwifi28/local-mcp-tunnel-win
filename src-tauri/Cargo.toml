[package]
name = "local-mcp-tunnel-win"
version = "0.1.0"
description = "Windows desktop controller for tunnel-client and local-mcp"
authors = ["walkingwifi28"]
edition = "2021"

[lib]
name = "local_mcp_tunnel_win_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
keyring = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }
